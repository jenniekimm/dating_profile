<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소개팅 프로필 등록</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState } = React;

        function App() {
          const [currentPage, setCurrentPage] = useState('form'); // 'form' or 'success'
          const SHEET_COLUMNS = [
            '사진2', '이름', '추천인', '연락처', '나이(년생으로 통일)',
            '지역', '직업', '엠비티아이', '자기소개', '선호스타일'
          ];
          const GOOGLE_SHEET_ID = '1qLLkvdPdEmCbYh_1FvXfLDKvMp9WoWYpryQ5RB7ks8A';
          const GOOGLE_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1qLLkvdPdEmCbYh_1FvXfLDKvMp9WoWYpryQ5RB7ks8A/edit';
          const GOOGLE_SHEET_NAME = '프로필';
          const createInitialFormData = () => ({
            name: '', referrer: '', contact: '', birthYear: '', location: '',
            occupation: '', mbti: '', intro: '', preferredStyle: '',
            photo1: null, photo2: null
          });
          const [formData, setFormData] = useState({
            ...createInitialFormData()
          });
          const [photoPreview1, setPhotoPreview1] = useState(null);
          const [photoPreview2, setPhotoPreview2] = useState(null);
          const [loading, setLoading] = useState(false);
          const [status, setStatus] = useState({ type: '', message: '' });

          // Google Apps Script 배포 URL
          const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzstOsD_2BHpvIijtxQMtgwl7A8pl06KtGitd8WjLSviUFknmOocLAPRxBOAWuAdQM3/exec';

          const handleChange = (e) => {
            const { name, value } = e.target;
            setFormData(prev => ({ ...prev, [name]: name === 'mbti' ? value.toUpperCase() : value }));
          };

          const handlePhotoChange = (e, photoNumber) => {
            const file = e.target.files[0];
            if (file) {
              if (!file.type.startsWith('image/')) {
                setStatus({ type: 'error', message: '사진 파일만 업로드할 수 있습니다.' });
                e.target.value = '';
                return;
              }
              if (file.size > 5 * 1024 * 1024) {
                setStatus({ type: 'error', message: '사진 크기는 5MB 이하여야 합니다.' });
                e.target.value = '';
                return;
              }
              
              const photoKey = `photo${photoNumber}`;
              setFormData(prev => ({ ...prev, [photoKey]: file }));
              
              const reader = new FileReader();
              reader.onloadend = () => {
                if (photoNumber === 1) setPhotoPreview1(reader.result);
                else setPhotoPreview2(reader.result);
              };
              reader.readAsDataURL(file);
            }
          };

          const convertToBase64 = (file) => {
            return new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve(reader.result.split(',')[1]);
              reader.onerror = reject;
              reader.readAsDataURL(file);
            });
          };

          const compactText = (value) => String(value || '').trim().replace(/[ \t]+/g, ' ');
          const multilineText = (value) => String(value || '').trim().replace(/\r\n/g, '\n');

          const normalizeBirthYear = (value) => {
            const match = String(value || '').match(/\d{4}/);
            if (!match) return '';
            const year = Number(match[0]);
            const currentYear = new Date().getFullYear();
            if (year < 1900 || year > currentYear) return '';
            return `${year}년생`;
          };

          const handleSubmit = async () => {
            const cleanedData = {
              name: compactText(formData.name),
              referrer: compactText(formData.referrer),
              contact: compactText(formData.contact),
              birthYear: normalizeBirthYear(formData.birthYear),
              location: compactText(formData.location),
              occupation: compactText(formData.occupation),
              mbti: compactText(formData.mbti).toUpperCase(),
              intro: multilineText(formData.intro),
              preferredStyle: multilineText(formData.preferredStyle)
            };

            const requiredFields = [
              ['name', '이름'], ['referrer', '추천인'], ['contact', '연락처'],
              ['location', '지역'], ['occupation', '직업'],
              ['mbti', '엠비티아이'], ['intro', '자기소개'], ['preferredStyle', '선호스타일']
            ];
            const missingField = requiredFields.find(([key]) => !cleanedData[key]);

            if (missingField) {
              setStatus({ type: 'error', message: `${missingField[1]}을(를) 입력해주세요.` });
              return;
            }
            if (!compactText(formData.birthYear)) {
              setStatus({ type: 'error', message: '나이를 입력해주세요.' });
              return;
            }
            if (!normalizeBirthYear(formData.birthYear)) {
              setStatus({ type: 'error', message: '나이는 4자리 출생연도로 입력해주세요. 예: 1995' });
              return;
            }
            setLoading(true);
            setStatus({ type: '', message: '' });
            try {
              let photo1Base64 = '', photo1Name = '';
              let photo2Base64 = '', photo2Name = '';
              
              if (formData.photo1) {
                photo1Base64 = await convertToBase64(formData.photo1);
                photo1Name = formData.photo1.name;
              }
              if (formData.photo2) {
                photo2Base64 = await convertToBase64(formData.photo2);
                photo2Name = formData.photo2.name;
              }
              const photoSummary = [photo1Name && `사진1: ${photo1Name}`, photo2Name && `사진2: ${photo2Name}`]
                .filter(Boolean)
                .join('\n');
              const row = {
                '사진2': photoSummary,
                '이름': cleanedData.name,
                '추천인': cleanedData.referrer,
                '연락처': cleanedData.contact,
                '나이(년생으로 통일)': cleanedData.birthYear,
                '지역': cleanedData.location,
                '직업': cleanedData.occupation,
                '엠비티아이': cleanedData.mbti,
                '자기소개': cleanedData.intro,
                '선호스타일': cleanedData.preferredStyle
              };
              
              await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain; charset=utf-8' },
                body: JSON.stringify({
                  ...row,
                  columns: SHEET_COLUMNS,
                  values: SHEET_COLUMNS.map(column => row[column] || ''),
                  row,
                  spreadsheetId: GOOGLE_SHEET_ID,
                  spreadsheetUrl: GOOGLE_SHEET_URL,
                  sheetName: GOOGLE_SHEET_NAME,
                  name: cleanedData.name,
                  referrer: cleanedData.referrer,
                  contact: cleanedData.contact,
                  birthYear: cleanedData.birthYear,
                  age: cleanedData.birthYear,
                  location: cleanedData.location,
                  occupation: cleanedData.occupation,
                  mbti: cleanedData.mbti,
                  intro: cleanedData.intro,
                  preferredStyle: cleanedData.preferredStyle,
                  specs: `자기소개: ${cleanedData.intro}\n선호스타일: ${cleanedData.preferredStyle}`,
                  photo1Base64, photo1Name, photo2Base64, photo2Name,
                  timestamp: new Date().toISOString()
                })
              });
              
              setCurrentPage('success');
            } catch (error) {
              setStatus({ type: 'error', message: '등록 중 오류가 발생했습니다.' });
            } finally {
              setLoading(false);
            }
          };

          if (currentPage === 'success') {
            return (
              <div className="min-h-screen bg-gradient-to-br from-green-50 to-blue-50 py-8 px-4 flex items-center justify-center">
                <div className="max-w-2xl w-full">
                  <div className="bg-white rounded-2xl shadow-xl p-8 text-center">
                    <div className="mb-6">
                      <svg className="w-24 h-24 mx-auto text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                      </svg>
                    </div>
                    
                    <h1 className="text-4xl font-bold text-gray-800 mb-4">등록 완료</h1>
                    <p className="text-xl text-gray-600 mb-8">프로필이 정상적으로 접수되었습니다.</p>
                    
                    <div className="bg-red-50 border-2 border-red-300 rounded-lg p-6 mb-6">
                      <div className="flex items-start gap-3">
                        <svg className="w-6 h-6 text-red-600 flex-shrink-0 mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                        </svg>
                        <div className="text-left">
                          <p className="text-red-800 font-bold text-lg mb-2">상대방에게 전달하기 전에 먼저 확인하겠습니다.</p>
                          <p className="text-red-700 text-base font-semibold">
                            개인정보는 소개 목적 외에는 사용하지 않습니다.
                          </p>
                        </div>
                      </div>
                    </div>

                    <div className="bg-blue-50 border border-blue-200 rounded-lg p-6">
                      <p className="text-gray-700 mb-4">저장 컬럼</p>
                      <p className="text-blue-800 font-medium text-base">
                        사진2 / 이름 / 추천인 / 연락처 / 나이(년생으로 통일) / 지역 / 직업 / 엠비티아이 / 자기소개 / 선호스타일
                      </p>
                    </div>

                    <button
                      onClick={() => {
                        setCurrentPage('form');
                        setFormData(createInitialFormData());
                        setPhotoPreview1(null);
                        setPhotoPreview2(null);
                        setStatus({ type: '', message: '' });
                      }}
                      className="mt-8 px-8 py-3 bg-gradient-to-r from-pink-500 to-purple-500 text-white rounded-lg font-semibold hover:from-pink-600 hover:to-purple-600 transition-all"
                    >
                      새로 등록하기
                    </button>
                  </div>
                </div>
              </div>
            );
          }

          return (
            <div className="min-h-screen bg-gradient-to-br from-pink-50 to-purple-50 py-8 px-4">
              <div className="max-w-2xl mx-auto">
                <div className="bg-white rounded-2xl shadow-xl p-8">
                  <div className="text-center mb-8">
                    <h1 className="text-3xl font-bold text-gray-800 mb-2">소개팅 프로필 등록</h1>
                    <p className="text-gray-600">필수 항목을 빠짐없이 입력해주세요.</p>
                  </div>

                  {status.message && (
                    <div className={`mb-6 p-4 rounded-lg ${status.type === 'success' ? 'bg-green-50 text-green-800' : 'bg-red-50 text-red-800'}`}>
                      {status.message}
                    </div>
                  )}

                  <div className="space-y-6">
                    <div>
                      <p className="text-center text-sm font-semibold text-gray-700 mb-4">프로필 사진 (최대 2장)</p>
                      <div className="flex justify-center gap-6">
                        <div className="flex flex-col items-center">
                          <label className="w-32 h-32 border-4 border-dashed border-gray-300 rounded-full flex items-center justify-center cursor-pointer hover:border-pink-400 transition-colors overflow-hidden bg-gray-50">
                            {photoPreview1 ? (
                              <img src={photoPreview1} alt="Preview 1" className="w-full h-full object-cover" />
                            ) : (
                              <div className="text-center text-gray-400">
                                <svg className="w-12 h-12 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>
                                <p className="text-xs mt-1">사진 1</p>
                              </div>
                            )}
                            <input type="file" accept="image/*" onChange={(e) => handlePhotoChange(e, 1)} className="hidden" />
                          </label>
                        </div>
                        
                        <div className="flex flex-col items-center">
                          <label className="w-32 h-32 border-4 border-dashed border-gray-300 rounded-full flex items-center justify-center cursor-pointer hover:border-pink-400 transition-colors overflow-hidden bg-gray-50">
                            {photoPreview2 ? (
                              <img src={photoPreview2} alt="Preview 2" className="w-full h-full object-cover" />
                            ) : (
                              <div className="text-center text-gray-400">
                                <svg className="w-12 h-12 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>
                                <p className="text-xs mt-1">사진 2</p>
                              </div>
                            )}
                            <input type="file" accept="image/*" onChange={(e) => handlePhotoChange(e, 2)} className="hidden" />
                          </label>
                        </div>
                      </div>
                      <p className="text-sm text-gray-500 mt-3 text-center">(각 5MB 이하...저장공간 이슈ㅜ)</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-sm font-semibold text-gray-700 mb-2">
                          이름 <span className="text-red-500">*</span>
                        </label>
                        <input type="text" name="name" value={formData.name} onChange={handleChange}
                          className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-400 focus:border-transparent outline-none"
                          placeholder="홍길동" />
                      </div>

                      <div>
                        <label className="block text-sm font-semibold text-gray-700 mb-2">
                          추천인 <span className="text-red-500">*</span>
                        </label>
                        <input type="text" name="referrer" value={formData.referrer} onChange={handleChange}
                          className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-400 focus:border-transparent outline-none"
                          placeholder="추천인 이름" />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-sm font-semibold text-gray-700 mb-2">
                          연락처 <span className="text-red-500">*</span>
                        </label>
                        <input type="text" name="contact" value={formData.contact} onChange={handleChange}
                          className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-400 focus:border-transparent outline-none"
                          placeholder="전화번호 또는 인스타그램" />
                      </div>

                      <div>
                        <label className="block text-sm font-semibold text-gray-700 mb-2">
                          나이(년생으로 통일) <span className="text-red-500">*</span>
                        </label>
                        <input type="text" inputMode="numeric" name="birthYear" value={formData.birthYear} onChange={handleChange}
                          className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-400 focus:border-transparent outline-none"
                          placeholder="예: 1995" />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-sm font-semibold text-gray-700 mb-2">
                          지역 <span className="text-red-500">*</span>
                        </label>
                        <input type="text" name="location" value={formData.location} onChange={handleChange}
                          className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-400 focus:border-transparent outline-none"
                          placeholder="서울 강남" />
                      </div>

                      <div>
                        <label className="block text-sm font-semibold text-gray-700 mb-2">
                          직업 <span className="text-red-500">*</span>
                        </label>
                        <input type="text" name="occupation" value={formData.occupation} onChange={handleChange}
                          className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-400 focus:border-transparent outline-none"
                          placeholder="소프트웨어 엔지니어" />
                      </div>
                    </div>

                    <div>
                      <label className="block text-sm font-semibold text-gray-700 mb-2">
                        엠비티아이 <span className="text-red-500">*</span>
                      </label>
                      <input type="text" name="mbti" value={formData.mbti} onChange={handleChange}
                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-400 focus:border-transparent outline-none"
                        placeholder="예: ENFP" />
                    </div>

                    <div>
                      <label className="block text-sm font-semibold text-gray-700 mb-2">
                        자기소개 <span className="text-red-500">*</span>
                      </label>
                      <textarea name="intro" value={formData.intro} onChange={handleChange} rows="4"
                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-400 focus:border-transparent outline-none resize-none"
                        placeholder="성격, 취미, 관심사 등을 적어주세요."></textarea>
                    </div>

                    <div>
                      <label className="block text-sm font-semibold text-gray-700 mb-2">
                        선호스타일 <span className="text-red-500">*</span>
                      </label>
                      <textarea name="preferredStyle" value={formData.preferredStyle} onChange={handleChange} rows="4"
                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-400 focus:border-transparent outline-none resize-none"
                        placeholder="선호하는 스타일을 적어주세요."></textarea>
                    </div>

                    <button onClick={handleSubmit} disabled={loading}
                      className={`w-full py-4 rounded-lg font-semibold text-white transition-all transform ${
                        loading ? 'bg-gray-400 cursor-not-allowed' : 'bg-gradient-to-r from-pink-500 to-purple-500 hover:from-pink-600 hover:to-purple-600 hover:scale-[1.02]'
                      }`}>
                      {loading ? '등록 중...무료 서비스라 쫌 걸림^__^' : '프로필 등록하기'}
                    </button>
                  </div>

                  <div className="mt-6 p-4 bg-blue-50 rounded-lg">
                    <p className="text-sm text-blue-800">
                      <strong>저장 순서:</strong> 사진2 / 이름 / 추천인 / 연락처 / 나이(년생으로 통일) / 지역 / 직업 / 엠비티아이 / 자기소개 / 선호스타일
                    </p>
                  </div>
                </div>
              </div>
            </div>
          );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
