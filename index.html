<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소개팅 프로필 등록</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState } = React;

        function App() {
          const [currentPage, setCurrentPage] = useState('form'); // 'form' or 'success'
          const [formData, setFormData] = useState({
            name: '', age: '', location: '', occupation: '', contact: '', specs: '', 
            photo1: null, photo2: null
          });
          const [photoPreview1, setPhotoPreview1] = useState(null);
          const [photoPreview2, setPhotoPreview2] = useState(null);
          const [loading, setLoading] = useState(false);
          const [status, setStatus] = useState({ type: '', message: '' });

          // 🔥 여기에 Google Apps Script URL 입력!
          const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzstOsD_2BHpvIijtxQMtgwl7A8pl06KtGitd8WjLSviUFknmOocLAPRxBOAWuAdQM3/exec';

          const handleChange = (e) => {
            const { name, value } = e.target;
            setFormData(prev => ({ ...prev, [name]: value }));
          };

          const handlePhotoChange = (e, photoNumber) => {
            const file = e.target.files[0];
            if (file) {
              if (file.size > 5 * 1024 * 1024) {
                setStatus({ type: 'error', message: '사진 크기는 5MB 이하여야 합니다.' });
                return;
              }
              
              const photoKey = `photo${photoNumber}`;
              setFormData(prev => ({ ...prev, [photoKey]: file }));
              
              const reader = new FileReader();
              reader.onloadend = () => {
                if (photoNumber === 1) setPhotoPreview1(reader.result);
                else setPhotoPreview2(reader.result);
              };
              reader.readAsDataURL(file);
            }
          };

          const convertToBase64 = (file) => {
            return new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve(reader.result.split(',')[1]);
              reader.onerror = reject;
              reader.readAsDataURL(file);
            });
          };

          const handleSubmit = async () => {
            if (!formData.name || !formData.age || !formData.location || !formData.occupation || !formData.contact) {
              setStatus({ type: 'error', message: '필수 항목을 모두 입력해주세요.' });
              return;
            }
            setLoading(true);
            setStatus({ type: '', message: '' });
            try {
              let photo1Base64 = '', photo1Name = '';
              let photo2Base64 = '', photo2Name = '';
              
              if (formData.photo1) {
                photo1Base64 = await convertToBase64(formData.photo1);
                photo1Name = formData.photo1.name;
              }
              if (formData.photo2) {
                photo2Base64 = await convertToBase64(formData.photo2);
                photo2Name = formData.photo2.name;
              }
              
              await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  name: formData.name, age: formData.age, location: formData.location,
                  occupation: formData.occupation, specs: formData.specs,
                  photo1Base64, photo1Name, photo2Base64, photo2Name,
                  timestamp: new Date().toISOString()
                })
              });
              
              setCurrentPage('success');
            } catch (error) {
              setStatus({ type: 'error', message: '등록 중 오류가 발생했습니다.' });
            } finally {
              setLoading(false);
            }
          };

          if (currentPage === 'success') {
            return (
              <div className="min-h-screen bg-gradient-to-br from-green-50 to-blue-50 py-8 px-4 flex items-center justify-center">
                <div className="max-w-2xl w-full">
                  <div className="bg-white rounded-2xl shadow-xl p-8 text-center">
                    <div className="mb-6">
                      <svg className="w-24 h-24 mx-auto text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                      </svg>
                    </div>
                    
                    <h1 className="text-4xl font-bold text-gray-800 mb-4">등록 완료</h1>
                    <p className="text-xl text-gray-600 mb-8">프로필이 성공적으로 등록되었습니다!</p>
                    
                    <div className="bg-red-50 border-2 border-red-300 rounded-lg p-6 mb-6">
                      <div className="flex items-start gap-3">
                        <svg className="w-6 h-6 text-red-600 flex-shrink-0 mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                        </svg>
                        <div className="text-left">
                          <p className="text-red-800 font-bold text-lg mb-2">⚠️ 저장 되는곳 : 화성시 내 노트북</p>
                          <p className="text-red-700 text-base font-semibold">
                            개인정보 유출 시 삼전 퇴사 후 내 2026년 성과급 전액으로 보상하겠음 
                          </p>
                        </div>
                      </div>
                    </div>

                    <div className="text-left">
                          <p className="text-red-800 font-bold text-lg mb-2"> 매칭전에 한번더 연락하겠슴</p>
                          <p className="text-red-700 text-base font-semibold">
                            나 이거 해서 돈 안번다 그냥 하는거다 커피 사주면 ㄳ
                          </p>
                        </div>

                    <button
                      onClick={() => {
                        setCurrentPage('form');
                        setFormData({ name: '', age: '', location: '', occupation: '', contact: '', specs: '', photo1: null, photo2: null });
                        setPhotoPreview1(null);
                        setPhotoPreview2(null);
                        setStatus({ type: '', message: '' });
                      }}
                      className="mt-8 px-8 py-3 bg-gradient-to-r from-pink-500 to-purple-500 text-white rounded-lg font-semibold hover:from-pink-600 hover:to-purple-600 transition-all"
                    >
                      새 프로필 등록하기
                    </button>
                  </div>
                </div>
              </div>
            );
          }

          return (
            <div className="min-h-screen bg-gradient-to-br from-pink-50 to-purple-50 py-8 px-4">
              <div className="max-w-2xl mx-auto">
                <div className="bg-white rounded-2xl shadow-xl p-8">
                  <div className="text-center mb-8">
                    <h1 className="text-3xl font-bold text-gray-800 mb-2">💕 소개팅 프로필 등록</h1>
                    <p className="text-gray-600">ㄱㄱ!</p>
                  </div>

                  {status.message && (
                    <div className={`mb-6 p-4 rounded-lg ${status.type === 'success' ? 'bg-green-50 text-green-800' : 'bg-red-50 text-red-800'}`}>
                      {status.message}
                    </div>
                  )}

                  <div className="space-y-6">
                    <div>
                      <p className="text-center text-sm font-semibold text-gray-700 mb-4">프로필 사진 (최대 2장)</p>
                      <div className="flex justify-center gap-6">
                        <div className="flex flex-col items-center">
                          <label className="w-32 h-32 border-4 border-dashed border-gray-300 rounded-full flex items-center justify-center cursor-pointer hover:border-pink-400 transition-colors overflow-hidden bg-gray-50">
                            {photoPreview1 ? (
                              <img src={photoPreview1} alt="Preview 1" className="w-full h-full object-cover" />
                            ) : (
                              <div className="text-center text-gray-400">
                                <svg className="w-12 h-12 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>
                                <p className="text-xs mt-1">사진 1</p>
                              </div>
                            )}
                            <input type="file" accept="image/*" onChange={(e) => handlePhotoChange(e, 1)} className="hidden" />
                          </label>
                        </div>
                        
                        <div className="flex flex-col items-center">
                          <label className="w-32 h-32 border-4 border-dashed border-gray-300 rounded-full flex items-center justify-center cursor-pointer hover:border-pink-400 transition-colors overflow-hidden bg-gray-50">
                            {photoPreview2 ? (
                              <img src={photoPreview2} alt="Preview 2" className="w-full h-full object-cover" />
                            ) : (
                              <div className="text-center text-gray-400">
                                <svg className="w-12 h-12 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>
                                <p className="text-xs mt-1">사진 2</p>
                              </div>
                            )}
                            <input type="file" accept="image/*" onChange={(e) => handlePhotoChange(e, 2)} className="hidden" />
                          </label>
                        </div>
                      </div>
                      <p className="text-sm text-gray-500 mt-3 text-center">(나 용량얼마 없슴ㅜ 각 5MB 이하로)</p>
                    </div>

                    <div>
                      <label className="block text-sm font-semibold text-gray-700 mb-2">
                        이름 <span className="text-red-500">*</span>
                      </label>
                      <input type="text" name="name" value={formData.name} onChange={handleChange}
                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-400 focus:border-transparent outline-none"
                        placeholder="홍길동" />
                    </div>

                    <div>
                      <label className="block text-sm font-semibold text-gray-700 mb-2">
                        나이 <span className="text-red-500">*</span>
                      </label>
                      <input type="number" name="age" value={formData.age} onChange={handleChange}
                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-400 focus:border-transparent outline-none"
                        placeholder="28" min="20" max="100" />
                    </div>

                    <div>
                      <label className="block text-sm font-semibold text-gray-700 mb-2">
                        사는 곳 <span className="text-red-500">*</span>
                      </label>
                      <input type="text" name="location" value={formData.location} onChange={handleChange}
                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-400 focus:border-transparent outline-none"
                        placeholder="서울시 강남구" />
                    </div>

                    <div>
                      <label className="block text-sm font-semibold text-gray-700 mb-2">
                        직업 <span className="text-red-500">*</span>
                      </label>
                      <input type="text" name="occupation" value={formData.occupation} onChange={handleChange}
                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-400 focus:border-transparent outline-none"
                        placeholder="소프트웨어 엔지니어" />
                    </div>

                    <div>
                      <label className="block text-sm font-semibold text-gray-700 mb-2">
                        연락처 <span className="text-red-500">*</span>
                      </label>
                      <input type="text" name="contact" value={formData.contact} onChange={handleChange}
                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-400 focus:border-transparent outline-none"
                        placeholder="010-1234-5678 또는 카카오톡 ID" />
                    </div>

                    <div>
                      <label className="block text-sm font-semibold text-gray-700 mb-2">기타 스펙 / 자기소개</label>
                      <textarea name="specs" value={formData.specs} onChange={handleChange} rows="4"
                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-400 focus:border-transparent outline-none resize-none"
                        placeholder="취미, 특기, MBTI, 학력, 키, 체형 등"></textarea>
                    </div>

                    <button onClick={handleSubmit} disabled={loading}
                      className={`w-full py-4 rounded-lg font-semibold text-white transition-all transform ${
                        loading ? 'bg-gray-400 cursor-not-allowed' : 'bg-gradient-to-r from-pink-500 to-purple-500 hover:from-pink-600 hover:to-purple-600 hover:scale-[1.02]'
                      }`}>
                      {loading ? '등록 중...무료서비스라 쩜 걸림ㅎ' : '프로필 등록하기'}
                    </button>
                  </div>

                  <div className="mt-6 p-4 bg-blue-50 rounded-lg">
                    <p className="text-sm text-blue-800">
                      <strong>📝 피곤하다ㅜ</strong> 나오늘 열시퇴근함 ㅜ
                    </p>
                  </div>
                </div>
              </div>
            </div>
          );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
